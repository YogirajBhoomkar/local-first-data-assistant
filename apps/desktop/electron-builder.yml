# Windows (NSIS installer) and macOS (dmg) packaging. Code signing and auto-update are out of scope:
# the placeholders below show where they would go.
appId: com.example.local-first-assistant
productName: Local-first data assistant
directories:
  output: release
files:
  - dist-main/**
  - dist-renderer/**
  - package.json
  - "!**/*.map"
# Native modules and the native DuckDB binding must live outside the asar archive so they can be loaded.
asar: true
asarUnpack:
  - "**/node_modules/@duckdb/**"
  - "**/node_modules/pdfjs-dist/**"
npmRebuild: false # DuckDB ships N-API prebuilt binaries: no rebuild for Electron's ABI is needed
win:
  target:
    - target: nsis
      arch: [x64]
  # signing placeholder: certificateFile / certificatePassword go here once a certificate exists
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.productivity
  # signing placeholder: identity / notarize settings go here
linux:
  target: AppImage
